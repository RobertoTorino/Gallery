name: Android Release Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip-version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure ProGuard rules file exists
        run: |
          if [ ! -f app/proguard-rules.pro ]; then
            printf '%s\n' '# Release minification rules.' > app/proguard-rules.pro
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The released version is derived from the latest v*.*.* git tag, so master
      # never receives an automated commit. app/build.gradle.kts is rewritten only
      # inside this workspace (for the build) and is never committed back.
      - name: Resolve next version
        id: bump
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import os
          import re
          import subprocess

          path = 'app/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', content)
          if not version_match:
              raise SystemExit('versionName not found in app/build.gradle.kts')

          semver = re.compile(r'^v(\d+)\.(\d+)\.(\d+)$')
          tags = subprocess.run(
              ['git', 'tag', '--list', 'v*', '--sort=-v:refname'],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          # Highest existing release tag wins; fall back to the checked-in versionName.
          current = next((t[1:] for t in tags if semver.match(t)), version_match.group(1))

          parts = [int(part) for part in current.split('.')]
          while len(parts) < 3:
              parts.append(0)
          parts[2] += 1

          existing = set(tags)
          while f"v{'.'.join(str(p) for p in parts)}" in existing:
              parts[2] += 1

          new_version = '.'.join(str(part) for part in parts)
          # Monotonic across major/minor bumps, since versionCode is no longer stored.
          new_code = parts[0] * 10000 + parts[1] * 100 + parts[2]

          content = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{new_version}"', content, count=1)
          content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', content, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'new_version={new_version}\n')
              out.write(f'tag=v{new_version}\n')
          PY

      - name: Build the Android app
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Tag the released commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.bump.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
