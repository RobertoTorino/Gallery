name: Android build, version bump and tag

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip-version]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure ProGuard rules file exists
        run: |
          if [ ! -f app/proguard-rules.pro ]; then
            printf '%s\n' '# Release minification rules.' > app/proguard-rules.pro
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Bump version in app config
        id: bump
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import os
          import re

          path = 'app/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', content)
          if not version_match:
              raise SystemExit('versionName not found in app/build.gradle.kts')

          current = version_match.group(1)
          parts = [int(part) for part in current.split('.')]
          while len(parts) < 3:
              parts.append(0)
          parts[0] = parts[0] if len(parts) >= 1 else 0
          parts[1] = parts[1] if len(parts) >= 2 else 0
          parts[2] += 1
          new_version = '.'.join(str(part) for part in parts)

          content = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{new_version}"', content, count=1)

          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          if code_match:
              new_code = int(code_match.group(1)) + 1
              content = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {new_code}', content, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'new_version={new_version}\n')
              out.write(f'tag=v{new_version}\n')
          PY

      - name: Build the Android app
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Commit version bump and create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No version change was needed."
            exit 0
          fi

          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip-version]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.bump.outputs.new_version }}"